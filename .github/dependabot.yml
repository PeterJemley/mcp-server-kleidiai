# The lint/type toolchain and SDKs are pinned exactly (see pyproject.toml —
# CI must enforce the same rules as the local venv). Dependabot turns "a new
# version exists" into a deliberate, CI-gated PR instead of a silent drift.
version: 2
updates:
  - package-ecosystem: pip
    directory: /packages/server-py
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/server-ts
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
