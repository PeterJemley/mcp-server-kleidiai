name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: packages/server-py
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: packages/server-py
        run: ruff check src tests
      - name: Type check
        working-directory: packages/server-py
        run: mypy src
      - name: Test
        working-directory: packages/server-py
        run: pytest

  test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        working-directory: packages/server-ts
        run: npm ci
      - name: Test
        working-directory: packages/server-ts
        run: npm test

  schema-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python server
        working-directory: packages/server-py
        run: pip install -e .
      - name: Build TS server
        working-directory: packages/server-ts
        run: npm ci && npm run build
      - name: Validate cross-SDK parity (contract, retrieval top-1, patterns)
        run: PYTHON=python ./distribution/schema-sync/check.sh

  # Free arm64 runners are public-repo only; this job activates when the
  # repo flips public at M4. It builds the demo baseline (not the KleidiAI
  # port — third_party isn't fetched in CI) to keep the harness compiling.
  build-demo-arm64:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build baseline benchmark harness
        working-directory: demos/kernel-port
        run: |
          clang++ -O3 -ffast-math -std=c++17 -march=armv8.2-a+dotprod+i8mm \
            -DBASELINE_ONLY src/matmul_f32.cpp -c -o /tmp/baseline.o
          echo "baseline kernel compiles on arm64"
