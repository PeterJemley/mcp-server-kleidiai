# QA set for retrieval + tool-use evals. A development set, not a held-out
# one: these questions were also used to choose the retriever (2026-08-05),
# so scores on them may run slightly high. A separate held-out set is planned.
#
# Each entry:
#   id:                  stable identifier
#   question:            natural-language question
#   expected_doc_ids:    corpus manifest IDs that answer it; scoring checks that the top-ranked doc is one of them
#   expected_tool:       which MCP tool should be called (null = retrieval-only)
#   expected_tool_args:  acceptable arg patterns (regex or exact)
#   notes:               curator notes — why this question, what it tests
#
# Curation target: ~50 entries by M2.
# Mix:
#   - 20 retrieval-only (find this doc)
#   - 20 tool-use (call this tool with these args)
#   - 10 end-to-end (multi-tool agent task)
#
# Mix status after batch 4 (2026-08-20): 51 entries = 37 retrieval-only,
# 10 tool-use, 4 end-to-end. The tool-use and end-to-end tranches remain
# under target ON PURPOSE: scoring them meaningfully needs the agent
# provider (gated on a model API key), and padding tool-use questions that
# only the deterministic provider can score would add near-duplicates of
# retrieval questions. Grow those tranches alongside the agent provider.
#
# Rule: never tune questions to make the server look better. Hard questions
# are deliberate. A regression is a signal, not a thing to mask.

version: 1

# First batch (15). Building toward the ~50 target. expected_doc_ids are
# ground truth — the doc that *should* answer the question — set independently
# of what the current retriever returns. Entries tagged HARD are ones the
# stub retriever got wrong when they were written; they are kept
# deliberately, and the tag records that history, not current difficulty.
